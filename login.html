<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Stamford Auto Care</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #c9302c;
      --dark: #0d1b2a;
      --light: #f8f9fa;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, #1a1a2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .login-container {
      background: white;
      padding: 3rem;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 450px;
      width: 100%;
    }
    
    .logo-section {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .logo-section img {
      width: 80px;
      margin-bottom: 1rem;
    }
    
    .logo-section h1 {
      color: var(--dark);
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    
    .logo-section p {
      color: #666;
      font-size: 0.95rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--dark);
      font-size: 0.95rem;
    }
    
    .form-group input {
      width: 100%;
      padding: 0.9rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(201, 48, 44, 0.1);
    }
    
    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    
    .remember-forgot label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      color: #666;
    }
    
    .remember-forgot a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    
    .remember-forgot a:hover {
      text-decoration: underline;
    }
    
    .btn-login {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--primary), #a82824);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 1rem;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(201, 48, 44, 0.4);
    }
    
    .divider {
      text-align: center;
      margin: 1.5rem 0;
      position: relative;
      color: #999;
      font-size: 0.9rem;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ddd;
    }
    
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    
    .signup-link {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
    }
    
    .signup-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    
    .signup-link a:hover {
      text-decoration: underline;
    }
    
    .back-home {
      text-align: center;
      margin-top: 1.5rem;
    }
    
    .back-home a {
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
    }
    
    .back-home a:hover {
      color: var(--primary);
    }
    
    .alert {
      padding: 0.8rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    
    .alert-error {
      background: #fee;
      color: #c00;
      border: 1px solid #fcc;
    }
    
    .alert-success {
      background: #efe;
      color: #060;
      border: 1px solid #cfc;
    }
    
    @media (max-width: 768px) {
      .login-container {
        padding: 2rem 1.5rem;
      }
      
      .logo-section h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo-section">
    <img src="logo.png" alt="Stamford Auto Care">
    <h1>Welcome Back</h1>
    <p>Sign in to access your account</p>
  </div>
  
  <div id="alertBox"></div>
  
  <form onsubmit="handleLogin(event)">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>
    </div>
    
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>
    
    <div class="remember-forgot">
      <label>
        <input type="checkbox" id="remember">
        Remember me
      </label>
      <a href="#forgot">Forgot password?</a>
    </div>
    
    <button type="submit" class="btn-login">Sign In</button>
    
    <div class="divider">OR</div>
    
    <div class="signup-link">
      Don't have an account? <a href="signup.html">Create Account</a>
    </div>
  </form>
  
  <div class="back-home">
    <a href="index.html">← Back to Website</a>
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  
  // Get registered users
  const users = JSON.parse(localStorage.getItem('users') || '[]');
  
  // Check if user exists
  const user = users.find(u => u.email === email && u.password === password);
  
  if (user) {
    // Set logged in user
    localStorage.setItem('loggedInUser', JSON.stringify(user));
    
    // Show success and redirect
    showAlert('Login successful! Redirecting...', 'success');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 1000);
  } else {
    showAlert('Invalid email or password. Please try again.', 'error');
  }
}

function showAlert(message, type) {
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
  
  if (type === 'success') {
    setTimeout(() => {
      alertBox.innerHTML = '';
    }, 2000);
  }
}

// Demo credentials message
window.onload = function() {
  const users = JSON.parse(localStorage.getItem('users') || '[]');
  if (users.length === 0) {
    showAlert('New user? Please create an account first.', 'error');
  }
}
</script>

</body>
</html>
