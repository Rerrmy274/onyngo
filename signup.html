<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Stamford Auto Care</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #c9302c;
      --dark: #0d1b2a;
      --light: #f8f9fa;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--dark) 0%, #1a1a2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .signup-container {
      background: white;
      padding: 3rem;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .logo-section {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .logo-section img {
      width: 80px;
      margin-bottom: 1rem;
    }
    
    .logo-section h1 {
      color: var(--dark);
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    
    .logo-section p {
      color: #666;
      font-size: 0.95rem;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--dark);
      font-size: 0.95rem;
    }
    
    .form-group input {
      width: 100%;
      padding: 0.9rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(201, 48, 44, 0.1);
    }
    
    .terms {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: #666;
    }
    
    .terms input[type="checkbox"] {
      margin-top: 0.2rem;
    }
    
    .terms a {
      color: var(--primary);
      text-decoration: none;
    }
    
    .btn-signup {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--primary), #a82824);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 1rem;
    }
    
    .btn-signup:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(201, 48, 44, 0.4);
    }
    
    .btn-signup:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .divider {
      text-align: center;
      margin: 1.5rem 0;
      position: relative;
      color: #999;
      font-size: 0.9rem;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ddd;
    }
    
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    
    .login-link {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
    }
    
    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    
    .login-link a:hover {
      text-decoration: underline;
    }
    
    .back-home {
      text-align: center;
      margin-top: 1.5rem;
    }
    
    .back-home a {
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
    }
    
    .back-home a:hover {
      color: var(--primary);
    }
    
    .alert {
      padding: 0.8rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    
    .alert-error {
      background: #fee;
      color: #c00;
      border: 1px solid #fcc;
    }
    
    .alert-success {
      background: #efe;
      color: #060;
      border: 1px solid #cfc;
    }
    
    @media (max-width: 768px) {
      .signup-container {
        padding: 2rem 1.5rem;
      }
      
      .form-row {
        grid-template-columns: 1fr;
      }
      
      .logo-section h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div class="signup-container">
  <div class="logo-section">
    <img src="logo.png" alt="Stamford Auto Care">
    <h1>Create Account</h1>
    <p>Join us to manage your vehicle services</p>
  </div>
  
  <div id="alertBox"></div>
  
  <form onsubmit="handleSignup(event)">
    <div class="form-row">
      <div class="form-group" style="margin-bottom: 0;">
        <label>First Name</label>
        <input type="text" id="firstName" placeholder="John" required>
      </div>
      
      <div class="form-group" style="margin-bottom: 0;">
        <label>Last Name</label>
        <input type="text" id="lastName" placeholder="Doe" required>
      </div>
    </div>
    
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="phone" placeholder="+254 700 000000" required>
    </div>
    
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="john@example.com" required>
    </div>
    
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
    </div>
    
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
    </div>
    
    <div class="terms">
      <input type="checkbox" id="terms" required>
      <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
    </div>
    
    <button type="submit" class="btn-signup">Create Account</button>
    
    <div class="divider">OR</div>
    
    <div class="login-link">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </form>
  
  <div class="back-home">
    <a href="index.html">← Back to Website</a>
  </div>
</div>

<script>
function handleSignup(e) {
  e.preventDefault();
  
  const firstName = document.getElementById('firstName').value;
  const lastName = document.getElementById('lastName').value;
  const phone = document.getElementById('phone').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  
  // Validate passwords match
  if (password !== confirmPassword) {
    showAlert('Passwords do not match!', 'error');
    return;
  }
  
  // Get existing users
  const users = JSON.parse(localStorage.getItem('users') || '[]');
  
  // Check if email already exists
  if (users.find(u => u.email === email)) {
    showAlert('Email already registered. Please login.', 'error');
    return;
  }
  
  // Create new user
  const newUser = {
    id: Date.now(),
    firstName,
    lastName,
    phone,
    email,
    password,
    createdAt: new Date().toISOString()
  };
  
  users.push(newUser);
  localStorage.setItem('users', JSON.stringify(users));
  
  // Show success
  showAlert('Account created successfully! Redirecting to login...', 'success');
  
  // Redirect to login
  setTimeout(() => {
    window.location.href = 'login.html';
  }, 2000);
}

function showAlert(message, type) {
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
  
  setTimeout(() => {
    alertBox.innerHTML = '';
  }, 3000);
}
</script>

</body>
</html>
